name: Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - uses: actions/checkout@v5

            - id: image
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  target: tools
                  push: true
                  tags: |
                      ${{ steps.image.outputs.image }}-tools:${{ github.sha }}
                      ${{ steps.image.outputs.image }}-tools:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - uses: docker/build-push-action@v6
              with:
                  target: backup
                  push: true
                  tags: |
                      ${{ steps.image.outputs.image }}-backup:${{ github.sha }}
                      ${{ steps.image.outputs.image }}-backup:latest
                  cache-from: type=gha

            - uses: docker/build-push-action@v6
              with:
                  target: app
                  push: true
                  tags: |
                      ${{ steps.image.outputs.image }}:${{ github.sha }}
                      ${{ steps.image.outputs.image }}:latest
                  cache-from: type=gha

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            packages: read
        env:
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
            SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
            SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        steps:
            - uses: actions/checkout@v5

            - name: Set up SSH
              run: |
                  install -m 700 -d ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/id_ed25519

            - name: Upload compose file
              run: scp -P "$SSH_PORT" docker-compose.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"

            - name: Pull and restart
              run: |
                  echo "${{ secrets.GITHUB_TOKEN }}" | ssh -p "$SSH_PORT" "$SSH_TARGET" "
                    set -e
                    cd '$DEPLOY_PATH'
                    docker login ghcr.io -u '${{ github.actor }}' --password-stdin
                    sed -i '/^TAG=/d' .env && echo 'TAG=${{ github.sha }}' >> .env
                    docker compose pull
                    docker logout ghcr.io
                    docker compose up -d --remove-orphans --wait
                    docker image prune -f
                  "
